[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsdl"
version = "0.1.0"
description = "Resumable downloader for the Inner Speech dataset + code-repo spreadsheet"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dsdl = "dsdl.cli:main"

[tool.setuptools.packages.find]
include = ["dsdl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
